[versions]
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
kotlinxDatetimeVersion = "0.7.1"
kotlinxIo = "0.9.1"
kotlinx-serialization = "1.11.0"
koog = "1.0.0"
mcp-kotlin = "0.8.3"
orgEclipseJgit = "7.7.0.202606012155-r"
deliverance = "0.0.4-SNAPSHOT"
skainet = "0.36.0"
skainet-transformers = "0.36.0"
slf4jSimple = "2.0.17"
ktor = "3.5.1"
shadow = "9.5.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetimeVersion" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
mcp-kotlin-server = { group = "io.modelcontextprotocol", name = "kotlin-sdk-server", version.ref = "mcp-kotlin" }

eclipse-jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "orgEclipseJgit" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jSimple" }

ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-sse = { group = "io.ktor", name = "ktor-server-sse", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }

# Deliverance - Java-native LLM inference
deliverance-core = { module = "io.teknek.deliverance:core", version.ref = "deliverance" }
deliverance-safetensors = { module = "io.teknek.deliverance:safetensors", version.ref = "deliverance" }

# SKaiNET — BOM-managed. Since 0.36 the core BOM lives under the sk.ainet group;
# the library artifacts stay under sk.ainet.core.
skainet-bom = { module = "sk.ainet:skainet-bom", version.ref = "skainet" }
skainet-lang-core = { module = "sk.ainet.core:skainet-lang-core" }
skainet-backend-cpu = { module = "sk.ainet.core:skainet-backend-cpu" }
# 0.22.0+: native FFM kernel provider (FP32 SGEMM + Q4_K matmul). Sibling to
# skainet-backend-cpu — auto-discovered via the KernelProvider SPI; takes
# priority over the Panama Vector kernel when its library loads.
skainet-backend-native-cpu = { module = "sk.ainet.core:skainet-backend-native-cpu" }
skainet-io-core = { module = "sk.ainet.core:skainet-io-core" }
skainet-io-gguf = { module = "sk.ainet.core:skainet-io-gguf" }

# SKaiNET-transformers — agent loop + tool calling (sk.ainet.transformers group).
# BOM-managed since 0.36: the transformers BOM is self-consistent again
# (the 0.21.x BOM referenced an unpublished core BOM — that debt is retired).
skainet-tx-bom = { module = "sk.ainet.transformers:skainet-transformers-bom", version.ref = "skainet-transformers" }
skainet-tx-runtime-kllama = { module = "sk.ainet.transformers:skainet-transformers-runtime-kllama" }
skainet-tx-agent = { module = "sk.ainet.transformers:skainet-transformers-agent" }
skainet-tx-inference-llama = { module = "sk.ainet.transformers:skainet-transformers-inference-llama" }


[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
